<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ho Sy Binh</title>
    <meta name="description" content="Portfolio của Hồ Sỹ Bình" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --text: #eaf2ff;
        --muted: #9fb5d6;
        --accent: #5cc8ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .page {
        max-width: 720px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 4rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.1rem;
      }
      .preloader {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: grid;
        place-items: center;
        z-index: 999;
        transition: opacity .35s ease, visibility .35s ease;
      }
      .preloader.hide {
        opacity: 0;
        visibility: hidden;
      }
      .loader {
        width: 64px;
        height: 64px;
        border: 5px solid rgba(255,255,255,.12);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="preloader" id="loader">
      <div class="loader" aria-label="Loading"></div>
    </div>

    <main class="page" style="display: none;">
      <h1>Ho Sy Binh</h1>
      <p>Portfolio đang sẵn sàng.</p>
    </main>
  </body>
</html>
