DOMAIN-SUFFIX,ppq.apple.com,REJECT
DOMAIN-SUFFIX,certs.apple.com,REJECT
DOMAIN-SUFFIX,crl.apple.com,REJECT

AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

# === SPOTIFY DIRECT DOMAINS (PERFECT PLAYBACK - NO AUDIO DROP) ===
DOMAIN,accounts.spotify.com,DIRECT
DOMAIN,login5.spotify.com,DIRECT
DOMAIN,auth.spotify.com,DIRECT
DOMAIN,apresolve.spotify.com,DIRECT
DOMAIN,api.spotify.com,DIRECT
DOMAIN-SUFFIX,scdn.co,DIRECT
DOMAIN-SUFFIX,spotifycdn.net,DIRECT
DOMAIN-SUFFIX,spotifycdn.com,DIRECT
# === ZERO LOGIN FAILURE (SPOTIFY, GOOGLE, FIREBASE & APPLE ID) ===
DOMAIN-SUFFIX,dealer.spotify.com,DIRECT
DOMAIN-SUFFIX,login.spotify.com,DIRECT
DOMAIN,accounts.google.com,DIRECT
DOMAIN,accounts.youtube.com,DIRECT
DOMAIN,oauth2.googleapis.com,DIRECT
DOMAIN,passkeys.google.com,DIRECT
DOMAIN,identitytoolkit.googleapis.com,DIRECT
DOMAIN,securetoken.googleapis.com,DIRECT
DOMAIN,appleid.apple.com,DIRECT

# === BLOCK QUIC FOR YOUTUBE & SPOTIFY ===
AND,((DOMAIN-SUFFIX,googlevideo.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN,www.youtube.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN,firebaseremoteconfig.googleapis.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN-KEYWORD,spotify), (PROTOCOL,UDP)),REJECT

# === BLOCK SPOTIFY ADS & TRACKERS 100% ===
